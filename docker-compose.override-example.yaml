# example docker compose override for local development
# allowing editing custom themes/modules from host machine
services:
  drupal:
    volumes:
      - ./assets:/var/www/drupal/assets:z,rw,delegated
      - ./composer.json:/var/www/drupal/composer.json:z,rw,delegated
      - ./composer.lock:/var/www/drupal/composer.lock:z,rw,delegated
      - ./config:/var/www/drupal/config:z,rw,delegated
      - ./web/modules/custom:/var/www/drupal/web/modules/custom:z,rw,delegated
      - ./web/themes/custom:/var/www/drupal/web/themes/custom:z,rw,delegated
  mariadb:
    ports:
      - "3306:3306"
