---
# Common to all services
x-common: &common
  restart: unless-stopped
  networks:
    default:
networks:
  default:

volumes:
  drupal-private-files: {}
  drupal-public-files: {}
  drupal-solr-config: {}
  mariadb-data: {}
  solr-data: {}

secrets:
  CERT_PUBLIC_KEY:
    file: ./certs/cert.pem
  CERT_AUTHORITY:
    file: ./certs/rootCA.pem
  UID:
    file: ./certs/UID
  DB_ROOT_PASSWORD:
    file: "./secrets/DB_ROOT_PASSWORD"
  DRUPAL_DEFAULT_ACCOUNT_PASSWORD:
    file: "./secrets/DRUPAL_DEFAULT_ACCOUNT_PASSWORD"
  DRUPAL_DEFAULT_DB_PASSWORD:
    file: "./secrets/DRUPAL_DEFAULT_DB_PASSWORD"
  DRUPAL_DEFAULT_SALT:
    file: "./secrets/DRUPAL_DEFAULT_SALT"

services:
  init:
    image: libops/base:3.2.2.0@sha256:0c6bab5444d4758bb977a42c1e5199cba733c7776e1aa006f8021108a785c547
    restart: no
    networks:
      default:
    volumes:
      - ./certs:/certs:rw,z
      - ./secrets:/secrets:rw,z
      - ./scripts:/scripts:ro,z
      - ./docker-compose.yml:/docker-compose.yml:ro,z
    entrypoint: /scripts/init-entrypoint.sh
    profiles: [none]

  mariadb:
    <<: *common
    image: libops/mariadb:11@sha256:1b0f53f277cedf95e1fa6df25580de01dd2d0722b09f39fe0d93cfb6263e26f3
    secrets:
      - source: DB_ROOT_PASSWORD
    volumes:
      - mariadb-data:/var/lib/mysql:rw

  drupal:
    <<: *common
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
    environment:
      DEVELOPMENT_ENVIRONMENT: "false"
      DRUPAL_DEFAULT_CONFIGDIR: "/var/www/drupal/config/sync"
      DRUPAL_DEFAULT_INSTALL_EXISTING_CONFIG: "true"
      DRUPAL_DEFAULT_NAME: "Drupal-Website"
      DRUPAL_DEFAULT_PROFILE: "minimal"
      DRUPAL_DEFAULT_SOLR_HOST: "solr"
      DRUPAL_DEFAULT_SOLR_CORE: "default"
      DRUPAL_DEFAULT_SOLR_PORT: "8983"
      INGRESS_HOSTNAMES: "localhost"
      INGRESS_SCHEME: "http"
      LIBOPS_SMTP_HOST: host.docker.internal
      LIBOPS_SMTP_PORT: "25"
    healthcheck:
      start_period: 10s
    depends_on:
      database-init:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
    secrets:
      - source: DRUPAL_DEFAULT_ACCOUNT_PASSWORD
      - source: DRUPAL_DEFAULT_DB_PASSWORD
        target: DB_PASSWORD
      - source: DRUPAL_DEFAULT_SALT
      - source: CERT_AUTHORITY
      - source: UID
    volumes:
      - type: volume
        source: drupal-public-files
        target: /var/www/drupal/web/sites/default/files
        read_only: false
      - type: volume
        source: drupal-private-files
        target: /var/www/drupal/private
        read_only: false
      - drupal-solr-config:/opt/solr/server/solr/default:z,rw
      - ./config:/var/www/drupal/config:z,rw

  database-init:
    image: libops/base:3.2.2.0@sha256:0c6bab5444d4758bb977a42c1e5199cba733c7776e1aa006f8021108a785c547
    restart: "no"
    networks:
      default:
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_NAME: drupal
      DB_USER: drupal
      DB_CHARACTER_SET: utf8mb4
      DB_COLLATION: utf8mb4_unicode_ci
    secrets:
      - source: DB_ROOT_PASSWORD
      - source: DRUPAL_DEFAULT_DB_PASSWORD
        target: DB_PASSWORD
    volumes:
      - ./scripts/init-database.sh:/usr/local/bin/init-database.sh:ro,z
    entrypoint: /usr/local/bin/init-database.sh
    depends_on:
      mariadb:
        condition: service_healthy

  solr:
    <<: *common
    image: libops/solr:9@sha256:267504e413f0d2226a734ad3031487dfd3f9ca75c0e3284c7d924eae6388e6b5
    volumes:
      - solr-data:/data:rw
      - type: volume
        source: drupal-solr-config
        target: /opt/solr/server/solr/default
        read_only: false
        volume:
          nocopy: true
    depends_on:
      drupal:
        condition: service_healthy

  traefik:
    <<: *common
    image: traefik:v3.7.5@sha256:e4d98158c01ad752fc1071d4e9573788747230d902cdde00a772516e692d07c9
    command: >-
      --ping=true
      --log.level=INFO
      --entryPoints.http.address=:80
      --entryPoints.http.transport.respondingTimeouts.readTimeout=300s
      --providers.file.directory=/etc/traefik/dynamic
      --providers.file.watch=true
      --api.insecure=false
      --api.dashboard=false
      --api.debug=false
    ports:
      - "80:80"
    volumes:
      - ./conf/traefik:/etc/traefik/dynamic:ro,z
    healthcheck:
      test: traefik healthcheck --ping
      start_period: 10s
    depends_on:
      drupal:
        condition: service_healthy
