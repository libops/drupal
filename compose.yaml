---
# Common to all services
x-common: &common
  restart: unless-stopped
  networks:
    default:
networks:
  default:

volumes:
  drupal-private-files: {}
  drupal-public-files: {}
  drupal-solr-config: {}
  mariadb-data: {}
  solr-data: {}

secrets:
  CERT_PUBLIC_KEY:
    file: ./certs/cert.pem
  CERT_AUTHORITY:
    file: ./certs/rootCA.pem
  UID:
    file: ./certs/UID
  DB_ROOT_PASSWORD:
    file: "./secrets/DB_ROOT_PASSWORD"
  DRUPAL_DEFAULT_ACCOUNT_PASSWORD:
    file: "./secrets/DRUPAL_DEFAULT_ACCOUNT_PASSWORD"
  DRUPAL_DEFAULT_DB_PASSWORD:
    file: "./secrets/DRUPAL_DEFAULT_DB_PASSWORD"
  DRUPAL_DEFAULT_SALT:
    file: "./secrets/DRUPAL_DEFAULT_SALT"

services:
  init:
    image: libops/base:3.2.2.0@sha256:57b396fd8b681d626c89359e3f68618d4822f46c9364854c9d4747c25ab9d705
    restart: no
    networks:
      default:
    working_dir: /work
    environment:
      CA_SUBJECT: /CN=LibOps Drupal Local Development CA
      CERT_DIR: /work/certs
      COMPOSE_FILE: /work/compose.yaml
      SECRETS_ROOT: /work/secrets
      SECRET_FORMAT_DRUPAL_DEFAULT_SALT: salt74
      SUBJECT_ALT_NAMES: DNS:*.libops.io,DNS:libops.io,DNS:*.libops.info,DNS:libops.info,DNS:*.drupal.traefik.me,DNS:drupal.traefik.me,DNS:localhost,IP:127.0.0.1,IP:::1
    volumes:
      - ./certs:/work/certs:rw,z
      - ./secrets:/work/secrets:rw,z
      - ./compose.yaml:/work/compose.yaml:ro,z
    entrypoint: /bin/bash
    command: ["-euc", "generate-certs.sh && generate-compose-secrets.sh"]
    profiles: [none]

  mariadb:
    <<: *common
    image: libops/mariadb:11@sha256:52bc6b83b75921239237d57db7b14fb7cbcecafee6ce110c49fd31d990ec0828
    secrets:
      - source: DB_ROOT_PASSWORD
    volumes:
      - mariadb-data:/var/lib/mysql:rw

  drupal:
    <<: *common
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
    environment:
      DEVELOPMENT_ENVIRONMENT: "false"
      DRUPAL_DEFAULT_CONFIGDIR: "/var/www/drupal/config/sync"
      DRUPAL_DEFAULT_INSTALL_EXISTING_CONFIG: "true"
      DRUPAL_DEFAULT_NAME: "Drupal-Website"
      DRUPAL_DEFAULT_PROFILE: "minimal"
      DRUPAL_DEFAULT_SOLR_HOST: "solr"
      DRUPAL_DEFAULT_SOLR_CORE: "default"
      DRUPAL_DEFAULT_SOLR_PORT: "8983"
      INGRESS_HOSTNAMES: "localhost"
      INGRESS_SCHEME: "http"
      LIBOPS_SMTP_HOST: host.docker.internal
      LIBOPS_SMTP_PORT: "25"
    healthcheck:
      start_period: 10s
    depends_on:
      database-init:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
    secrets:
      - source: DRUPAL_DEFAULT_ACCOUNT_PASSWORD
      - source: DRUPAL_DEFAULT_DB_PASSWORD
        target: DB_PASSWORD
      - source: DRUPAL_DEFAULT_SALT
      - source: CERT_AUTHORITY
      - source: UID
    volumes:
      - ./scripts/drupal-lint-custom.sh:/usr/local/lib/sitectl/drupal-lint-custom.sh:ro,z
      - ./scripts/drupal-rollout-migrate.sh:/usr/local/lib/sitectl/drupal-rollout-migrate.sh:ro,z
      - ./scripts/drupal-test-custom.sh:/usr/local/lib/sitectl/drupal-test-custom.sh:ro,z
      - ./scripts/drupal-verify-config-drift.php:/usr/local/lib/sitectl/drupal-verify-config-drift.php:ro,z
      - ./scripts/drupal-verify-cron-queue.php:/usr/local/lib/sitectl/drupal-verify-cron-queue.php:ro,z
      - ./scripts/drupal-verify-solr.php:/usr/local/lib/sitectl/drupal-verify-solr.php:ro,z
      - ./scripts/drupal-wait-installed.sh:/usr/local/lib/sitectl/drupal-wait-installed.sh:ro,z
      - type: volume
        source: drupal-public-files
        target: /var/www/drupal/web/sites/default/files
        read_only: false
      - type: volume
        source: drupal-private-files
        target: /var/www/drupal/private
        read_only: false
      - drupal-solr-config:/opt/solr/server/solr/default:z,rw

  database-init:
    image: libops/base:3.2.2.0@sha256:57b396fd8b681d626c89359e3f68618d4822f46c9364854c9d4747c25ab9d705
    restart: "no"
    networks:
      default:
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_NAME: drupal
      DB_USER: drupal
      DB_CHARACTER_SET: utf8mb4
      DB_COLLATION: utf8mb4_unicode_ci
    secrets:
      - source: DB_ROOT_PASSWORD
      - source: DRUPAL_DEFAULT_DB_PASSWORD
        target: DB_PASSWORD
    entrypoint: /usr/local/bin/init-database.sh
    depends_on:
      mariadb:
        condition: service_healthy

  solr:
    <<: *common
    image: libops/solr:9@sha256:e89b85fac6137e6e094fd9805100bca2d0e52e27265102e7ee1f9583ffc8969d
    volumes:
      - solr-data:/data:rw
      - type: volume
        source: drupal-solr-config
        target: /opt/solr/server/solr/default
        read_only: false
        volume:
          nocopy: true
    depends_on:
      drupal:
        condition: service_healthy

  traefik:
    <<: *common
    image: traefik:v3.7.13@sha256:f86a2cab1b5c649070c49f883c743dd32d8485a56e3368c5f93b9e91f1e91259
    command: >-
      --ping=true
      --log.level=INFO
      --entryPoints.http.address=:80
      --entryPoints.http.transport.respondingTimeouts.readTimeout=300s
      --providers.file.directory=/etc/traefik/dynamic
      --providers.file.watch=true
      --api.insecure=false
      --api.dashboard=false
      --api.debug=false
    ports:
      - "80:80"
    volumes:
      - ./conf/traefik:/etc/traefik/dynamic:ro,z
    healthcheck:
      test: traefik healthcheck --ping
      start_period: 10s
    depends_on:
      drupal:
        condition: service_healthy
